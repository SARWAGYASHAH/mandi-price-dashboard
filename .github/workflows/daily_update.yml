name: Daily Mandi Price Update

# Runs daily at 12:00 PM IST (6:30 AM UTC) and on manual dispatch
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Override: fetch the last N days (leave empty for incremental)'
        required: false
        default: ''
      full_refresh:
        description: 'Full refresh (ignore watermark, fetch 365 days)?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      # ── Fetch new data ──────────────────────────────────────────────
      - name: Fetch latest mandi prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            ARGS="--full-refresh"
          elif [ -n "${{ github.event.inputs.days_back }}" ]; then
            ARGS="--days-back ${{ github.event.inputs.days_back }}"
          fi
          python scripts/fetch_live_data.py $ARGS

      # ── Run full analysis pipeline ──────────────────────────────────
      - name: Run analysis pipeline
        run: python scripts/run_pipeline.py

      # ── Commit and push if there are changes ────────────────────────
      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/cleaned/ \
            data/outputs/ \
            data/ingestion_metadata.json \
            insights/ \
            visuals/ \
            docs/assets/ \
            powerbi/dashboard_screenshots/

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📊 Auto-update mandi prices: $(date -u +%Y-%m-%d)"
            git push
          fi
